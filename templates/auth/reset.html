{% extends "base.html" %}
{% block title %}Reset Password - SocialSense AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card border-secondary">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-lock fa-3x text-primary mb-2"></i>
                    <h3 class="fw-bold">Reset Password</h3>
                    <p class="text-muted">Choose a new password for your account.</p>
                </div>

                <form method="POST" action="{{ url_for('auth.password_reset', token=token) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="new_password" class="form-label">New password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password"
                               required autocomplete="new-password">
                        <div class="form-text">Minimum 8 characters with uppercase, lowercase, and digit.</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm new password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               required autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        <i class="fas fa-check me-2"></i>Reset Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
