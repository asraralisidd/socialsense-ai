{% extends "base.html" %}
{% block title %}Reset password - SocialSense AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-4 py-md-5">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="ss-card ss-card--elevated">
            <div class="card-body p-4 p-md-4">
                <div class="text-center mb-4">
                    <div class="ss-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.25rem;">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h1 class="h4 fw-bold mb-1">Reset password</h1>
                    <p class="text-muted small mb-0">Choose a new password for your account.</p>
                </div>

                <form method="POST" action="{{ url_for('auth.password_reset', token=token) }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="new_password" class="form-label">New password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="new_password" name="new_password"
                                   required autocomplete="new-password" minlength="8">
                        </div>
                        <div class="form-text">Minimum 8 characters with uppercase, lowercase, and digit.</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm new password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-check-circle"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                   required autocomplete="new-password" minlength="8">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        <i class="fas fa-check me-2"></i>Reset password
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('auth.login') }}" class="small text-decoration-none">Back to sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
